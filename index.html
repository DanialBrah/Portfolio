    <!--
      Applies the stored theme before first paint so a dark-mode visitor never
      sees a white flash. Kept inline and synchronous on purpose — running this
      from React would fire after the browser has already painted.

      ⚠ The CSP in vercel.json allows this script by SHA-256 hash. Changing even
      one character here changes that hash, and the browser will silently block
      the script (the white flash comes back, with no build error).
      `npm run build` runs scripts/check-csp-hash.mjs, which fails the build and
      prints the new hash to paste into vercel.json.
    -->
    <script>
      ;(function () {
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var stored = null
        try {
          stored = localStorage.getItem('portfolio-theme')
        } catch (err) {
          // localStorage is blocked (private mode / cookies disabled). There is
          // no stored choice to read, so fall through to the OS preference.
          stored = null
        }
        if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
