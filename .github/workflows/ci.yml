name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs strictly from the lockfile, so CI can never resolve a
      # different dependency tree than the one that was reviewed.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Also runs the CSP hash check, so a drifted inline script fails here.
      - name: Typecheck and build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fails on high/critical advisories only — moderate findings in dev-only
      # tooling should not block a portfolio deploy.
      - name: Audit production dependencies
        run: npm run audit:ci
